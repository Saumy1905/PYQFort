# Site settings
title: PYQFort
description: PYQFort is providing premium, engineered, educational resources to empower the students of India cause 'we have nothing to lose but our chains'
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://pyqfort.com" # the base hostname & protocol for your site

# Build settings
markdown: kramdown
highlighter: rouge
permalink: pretty

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - README.md
  - Data_Dump
  - SECURITY.MD
  - LICENSE
  - CONTRIBUTING.md

# Collections
collections:
  colleges:
    output: false

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
