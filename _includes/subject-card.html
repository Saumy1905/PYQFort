<div class="subject-card"
  data-refact-name="{{ include.name | default: include.title }}"
  data-refact-code="{{ include.code | default: include.id }}"
  data-refact-description="{{ include.description | default: 'Subject information' }}"
  data-refact-pdf-count="{{ include.pdf_count | default: 0 }}"
  data-refact-url="{{ include.url }}">
  <button class="refact-add-btn" aria-label="Add to Refact" title="Save to Refact">
    <i class="fa-solid fa-rotate"></i>
  </button>
  <div class="subject-icon">
    <i class="fas fa-book"></i>
  </div>
  <div class="subject-content">
    <h2 class="subject-title">{{ include.name | default: include.title }}</h2>
    <p class="subject-code">{{ include.code | default: include.id }}</p>
    <p class="subject-description">{{ include.description | default: "Subject information" }}</p>
    <p class="subject-meta">{{ include.pdf_count | default: 0 }} PDF{% if include.pdf_count != 1 %}s{% endif %} available</p>
    <a href="{{ include.url }}" class="btn-view">View Subject</a>
  </div>
</div>
