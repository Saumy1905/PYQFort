<style>
  .notes-card {
    display: flex;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 12px;
    overflow: hidden;
    transition: opacity 0.3s ease;
    position: relative;
  }
  
  .dark-theme .notes-card {
    background: linear-gradient(135deg, #5568d3 0%, #6a3f8f 100%);
  }
  
  .notes-card:hover {
    opacity: 0.95;
  }
  
  .notes-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 100%);
    pointer-events: none;
  }
  
  .notes-icon {
    position: relative;
    padding: 1.5rem;
    font-size: 2rem;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(255, 255, 255, 0.15);
    backdrop-filter: blur(10px);
    color: white;
    min-width: 80px;
  }
  
  .tag-new-notes {
    position: absolute;
    top: 0px;
    right: -10px;
    background: linear-gradient(135deg, #ff6b6b 0%, #ff4757 100%);
    color: white;
    font-size: 10px;
    font-weight: bold;
    padding: 4px 8px;
    border-radius: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  
  .notes-content {
    position: relative;
    padding: 1rem 1.25rem;
    flex-grow: 1;
    color: white;
  }
  
  .notes-badge {
    display: inline-block;
    background: rgba(255, 255, 255, 0.25);
    backdrop-filter: blur(10px);
    color: white;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 0.5rem;
    border: 1px solid rgba(255, 255, 255, 0.3);
  }
  
  .notes-title {
    font-size: 1.2rem;
    margin-bottom: 0.5rem;
    color: white;
    font-weight: 600;
  }
  
  .notes-meta {
    margin-bottom: 1rem;
    color: rgba(255, 255, 255, 0.9);
    font-size: 0.85rem;
  }
  
  .notes-actions {
    display: flex;
    gap: 0.5rem;
  }
  
  .btn-notes-view {
    display: inline-block;
    padding: 0.7rem 1.2rem;
    background: rgba(255, 255, 255, 0.95);
    color: #667eea;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    text-align: center;
    transition: all 0.3s ease;
    font-size: 0.95rem;
  }
  
  .btn-notes-view:hover {
    background: white;
    color: #667eea;
  }
  
  .notes-uploader {
    position: absolute;
    bottom: 10px;
    right: 10px;
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    color: white;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    padding: 4px 8px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    transition: all 0.3s ease;
  }
  
  .notes-uploader i {
    font-size: 13px;
  }
  
  .notes-uploader:hover {
    background: rgba(255, 255, 255, 0.3);
  }
  
  /* Praxian Premium Styles for Notes */
  .notes-actions-premium {
    display: flex;
    gap: 0.5rem;
  }
  
  .btn-notes-access {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 0.7rem 1rem;
    background: rgba(255, 255, 255, 0.95);
    color: #667eea;
    border: none;
    border-radius: 6px;
    font-weight: 600;
    text-align: center;
    transition: all 0.3s ease;
    /* box-shadow: 0 4px 8px rgba(0,0,0,0.1); */
    flex: 1;
    position: relative;
    font-size: 0.95rem;
  }
  
  .btn-notes-access:hover {
    background: white;
    transform: translateY(-2px);
    box-shadow: 0 6px 12px rgba(0,0,0,0.15);
    color: #667eea;
  }
  
  .btn-notes-view-premium {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    padding: 0.7rem 1rem;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    color: white;
    border: 2px solid rgba(255, 255, 255, 0.8);
    border-radius: 6px;
    font-weight: 600;
    text-align: center;
    transition: all 0.3s ease;
    flex: 1;
    font-size: 0.95rem;
  }
  
  .btn-notes-view-premium:hover {
    background: rgba(255, 255, 255, 0.3);
    border-color: white;
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    color: white;
  }
  
  .praxian-asterisk-notes {
    position: relative;
    top: -0.4em;
    margin-left: 2px;
    color: #FF9700;
    font-weight: bold;
    font-size: 1em;
    line-height: 0;
    vertical-align: super;
  }
  
  /* @keyframes pulse-notes {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.1); }
  } */
  
  /* Responsive adjustments for praxian buttons in notes */
  @media (max-width: 768px) {
    .notes-actions-premium {
      flex-direction: column;
      gap: 0.5rem;
    }
    
    .btn-notes-access,
    .btn-notes-view-premium {
      width: 100%;
    }
  }
</style>

<div class="notes-card">
  <div class="notes-icon">
    <i class="fas fa-book-open"></i>
    {% if include.new %}
    <span class="tag-new-notes">NEW</span>
    {% endif %}
  </div>
  <div class="notes-content">
    <div class="notes-badge">
      <i class="fas fa-graduation-cap"></i> Study Notes
    </div>
    <h3 class="notes-title">{{ include.title }}</h3>
    <p class="notes-meta">
      {% if include.pages %}
        <i class="fas fa-file-alt"></i> {{ include.pages }} pages
      {% endif %}
    </p>
    {% if include.praxian and include.praxian_link %}
    <div class="notes-actions notes-actions-premium">
      <a href="{{ include.praxian_link }}" class="btn-notes-access" target="_blank" rel="noopener noreferrer">
        Access<span class="praxian-asterisk-notes">*</span>
      </a>
      <a href="{{ include.view_url }}" class="btn-notes-view-premium">
        <i class="fas fa-eye"></i> Preview
      </a>
    </div>
    {% else %}
    <div class="notes-actions">
      <a href="{{ include.view_url }}" class="btn-notes-view">
        <i class="fas fa-eye"></i> View Notes
      </a>
    </div>
    {% endif %}
    {% if include.upload %}
    <div class="notes-uploader">
      <i class="fas fa-user-circle"></i>
      <span>{{ include.upload }}</span>
    </div>
    {% endif %}
  </div>
</div>
