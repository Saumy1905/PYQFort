<div class="college-card">
  <div class="college-image-container">
    {% assign image_path = '/assets/images/college-images/' | append: include.slug | append: '.png' | relative_url %}
    {% assign icon_fallback = include.icon | default: 'university' %}
    <img src="{{ image_path }}" 
         alt="{{ include.name }}" 
         class="college-image"
         onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
    <div class="college-icon-fallback" style="display: none;">
      <i class="fas fa-{{ icon_fallback }}"></i>
    </div>
  </div>
  <div class="college-content">
    <h2 class="college-title">{{ include.name }}</h2>
    <p class="college-description">{{ include.description }}</p>
    <a href="{{ '/colleges/' | append: include.slug | append: '/' | relative_url }}" class="btn-view">View Colleges</a>
  </div>
</div>
